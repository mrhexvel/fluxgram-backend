services:
  vault-agent:
    image: hashicorp/vault:1.21.0@sha256:62dd55c9ccbdc0af0a9269e87481a64650258907434d5ddb5e795e2eb2ac5780
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        test "$(stat -c '%u:%g:%a' /vault/bootstrap)" = "65534:65534:700"
        test "$(stat -c '%u:%g:%a' /vault/secrets)" = "65534:65534:700"
        exec /bin/vault agent -config=/vault/config/agent.hcl
    user: "65534:65534"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    cpus: 0.5
    mem_limit: 128m
    pids_limit: 64
    restart: unless-stopped
    stop_grace_period: 10s
    volumes:
      - type: bind
        source: ./vault/agent.hcl
        target: /vault/config/agent.hcl
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${VAULT_AGENT_CA_FILE:?set VAULT_AGENT_CA_FILE}
        target: /vault/tls/vault-ca.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${VAULT_AGENT_BOOTSTRAP_DIR:?set VAULT_AGENT_BOOTSTRAP_DIR}
        target: /vault/bootstrap
        bind:
          create_host_path: false
      - type: bind
        source: ${VAULT_AGENT_TOKEN_DIR:?set VAULT_AGENT_TOKEN_DIR}
        target: /vault/secrets
        bind:
          create_host_path: false
      - type: tmpfs
        target: /vault/file
        read_only: true
        tmpfs:
          size: 1048576
          mode: 365
      - type: tmpfs
        target: /vault/logs
        read_only: true
        tmpfs:
          size: 1048576
          mode: 365
    healthcheck:
      test:
        - CMD-SHELL
        - VAULT_ADDR=https://vault:8200 VAULT_CACERT=/vault/tls/vault-ca.pem VAULT_TOKEN="$$(cat /vault/secrets/token)" /bin/vault token lookup -format=json >/dev/null
      interval: 5s
      timeout: 2s
      retries: 12
    networks:
      - vault

networks:
  vault:
    external: true
    name: ${VAULT_NETWORK:?set VAULT_NETWORK}

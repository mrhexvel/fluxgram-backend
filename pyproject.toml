[project]
name = "fluxgram-backend"
version = "0.1.0"
description = "Backend services for FluxGram profiles and badges"
readme = "README.md"
authors = [{ name = "mr.hexvel", email = "mr.hexvel@gmail.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.12.5,<3",
]

[dependency-groups]
dev = [
    "jsonschema>=4.25.1,<5",
    "mypy>=1.18.2,<2",
    "openapi-spec-validator>=0.7.2,<0.8",
    "pytest>=8.4.2,<9",
    "pyyaml>=6.0.3,<7",
    "ruff>=0.14.1,<0.15",
    "types-jsonschema>=4.25.1.20250822",
    "types-pyyaml>=6.0.12.20250915",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
